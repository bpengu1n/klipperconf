[gcode_macro mainled_on]
gcode:
    SET_LED LED=main_led WHITE=1

[gcode_macro mainled_off]
gcode:
    SET_LED LED=main_led WHITE=0

#--------------------------------------------------------------------#
#--------------------------------------------------------------------#

[force_move]
enable_force_move: True

[gcode_macro _global_var]
variable_pause_park:{'x': 0, 'y': 0, 'z': 10, 'e': 1}
variable_cancel_park:{'x': 0, 'y': 350, 'z': 10, 'e': 1}
variable_z_maximum_lifting_distance: 345
variable_pause_resume_travel_speed: 150
variable_bed_mesh_calibrate_target_temp: 60
variable_load_filament_extruder_temp: 230
variable_heat_soak_time: 0 # in minutes
variable_clean_nozzle_pos: {'x': 347, 'y': 315, 'z': 6}
variable_preheat_temp: 125
variable_clean_bed_temp: 60
variable_post_print_fan_speed: 0.75
variable_post_print_cool_time: 120
gcode:

[gcode_macro START_PRINT]
description: 
variable_state: 'Prepare'
variable_record_extruder_temp:0
variable_max_record_extruder_temp:0
gcode:
    {% set bedtemp = params.BED_TEMP|default(60)|int %}
    {% set hotendtemp = params.EXTRUDER_TEMP|default(230)|int %}
    {% set heatsoak = params.HEATSOAK|default(True)|int %}
    {% set heatsoak_time = printer['gcode_macro _global_var'].heat_soak_time|default(0)|int %} # takes heatsoak time from global variables
    {% set mesh_name = "default" %}

    {% set extruder_target_temp = 125 %}

    {% set bed_target_temp = bedtemp|int %}

    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

    LCD_ORANGE #MOD LCD heating 
    BEEP #MOD Start signal
    M400

    CLEAR_PAUSE
    
    G90
    {% if state == 'Prepare' %}

        {action_respond_info("Prepare!")}

        # {% if printer['filament_motion_sensor encoder_sensor'].enable == True and
        #       printer['filament_motion_sensor encoder_sensor'].filament_detected != True
        # %}
        #     M117 No filament!
        #     {action_respond_info("Please Insert filament in Sensor!")}
        #     CANCEL_PRINT
        # {% endif %}

        {% if printer.extruder.temperature < extruder_target_temp %}
            M117 Nozzle pre-heating...
            {action_respond_info("Nozzle pre-heating...")}
            M109 S{extruder_target_temp} 
        {% endif %}

        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G4 P2000 #MOD Add pause for steppers
            G28
        {% endif %}

        #Start exhaust fan
        #SET_FAN_SPEED FAN=exhaust_fan SPEED=1

        {action_respond_info("Check Heating!")}

        {% if printer.heater_bed.temperature < bed_target_temp %}
            M117 Bed heating...
            {action_respond_info("Bed heating...")}
            M190 S{bed_target_temp}
        {% endif %}

        M140 S{bed_target_temp}
        M104 S{extruder_target_temp}

        
        {% if heatsoak == True %}
          M117 Short Heat Soak
          G4 P{heatsoak_time * 60000} # pause for x number of minute(s) (see variable_heat_soak_time)
        {% endif %}
        
        {% if printer.quad_gantry_level.applied|lower != 'true' %}
            M117 QGL
            QUAD_GANTRY_LEVEL_BASE # We use the _BASE variant here as not to remove the stock Sovol override (but we also don't want to use the Sovol override here)
            M117 Home Z after QGL
            G28 Z # And once again after QGL, important..
            # M117 Auto Z Offset
            # Z_OFFSET_CALIBRATION
        {% endif %}
        # We use the _BASE variant here as not to remove the stock Sovol override (but we also don't want to use the Sovol override here)
        # Remove the comment to add 'METHOD=rapid_scan' when using the Eddy probe
        M117 Bed Mesh
        BED_MESH_CALIBRATE_BASE ADAPTIVE=1 #METHOD=rapid_scan

        #CLEAN_NOZZLE #MOD add nozzle cleaning
        G1 Z0.0 #MOD lower nozzle to avoid oozing

        # Set final temperatures before printing instead of relying on the OrcaSlicer start gcode..
        M117 Final Heating...
        {action_respond_info("Final heating...")}
        M140 S{bedtemp} ;set bed temp
        M104 S{hotendtemp} ;set extruder temp
        M109 S{hotendtemp};wait for extruder temp
        G1 Z0.6 #MOD Move up a bit again for bed safety
        M190 S{bedtemp} ;wait for bed temp
        
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Start"' 
        UPDATE_DELAYED_GCODE ID=_print_start_wait DURATION=0.5

    {% elif state == 'Start' %}
        M117 Printing
        {action_respond_info("Start!")}
    {% endif %}
    

[gcode_macro END_PRINT]
description: Finalizes a print job by retracting filament, parking the toolhead, and turning off heaters and fans.
variable_state: 'normal'
gcode:
    {% if 'gcode_macro _global_var' not in printer %}
        {action_respond_info("Error: _global_var macro missing!")}
        M117 ERROR: GLOBAL VAR MISSING
        LCD_RED
        CANCEL_PRINT
    {% endif %}
    {% set z_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance|int %}
    {% set e_mintemp  = printer.configfile.settings['extruder'].min_extrude_temp %}

    M400
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=record_extruder_temp VALUE=0  
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_record_extruder_temp VALUE=0

    M117 PRINT FINISHED!
    G91
    {% if printer['filament_motion_sensor encoder_sensor'].enable == True and
          printer['filament_motion_sensor encoder_sensor'].filament_detected == True
    %}
        {% if (printer.extruder.target != 0 and printer.extruder.temperature >= printer.extruder.target) or
              printer.extruder.temperature >= e_mintemp
        %}
            G1 E-2 F2700
            G1 E-2 Z0.2 F2400
        {% endif %}
    {% endif %}

    {% if (printer.gcode_move.position.z + 10) < z_max %}
        G1 Z+10 F3000
    {% else %}
        G1 Z+{(z_max - printer.gcode_move.position.z)} F3000
    {% endif %}
    G90
    G1 X0 Y360 F9000

    TURN_OFF_HEATERS
    M106 S{printer['gcode_macro _global_var'].post_print_fan_speed}
    UPDATE_DELAYED_GCODE ID=_ALL_FAN_OFF DURATION={printer['gcode_macro _global_var'].post_print_cool_time} # MOD Extra  cooling after print
    M84 X Y Z E  

    M220 S100
    M221 S100

    LCD_DEFAULT # MOD LCD Print finished - return to default
    BEEP # MOD acoustic end signal
    CLEAR_PAUSE
    #PRINT_END

    {action_respond_info("PRINT FINISHED!")}

[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %}
      RESPOND TYPE=echo MSG="No operations in 10min!"
    {% else %}
     M84
     TURN_OFF_HEATERS
    {% endif %}

[delayed_gcode exhaust_fan_off]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[delayed_gcode _ALL_FAN_OFF]
gcode:
    # Run the exhaust fan for another 2min after the other fans and then turn it off
    # UPDATE_DELAYED_GCODE ID=exhaust_fan_off DURATION=120
    M107
    M106 S0

[gcode_macro _SET_TEMPERATURE]
description: SETS EXTRUDER AND BED TEMPERATURES WITH OPTIONAL WAIT
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(printer['gcode_macro _global_var'].preheat_temp)|int %}
    {% set bed_temp = params.BED_TEMP|default(printer['gcode_macro _global_var'].calibrate_bed_temp)|int %}
    {% set wait = params.WAIT|default('true')|lower %}
    RESPOND TYPE=echo MSG="SET EXTRUDER {extruder_temp}°C"
    RESPOND TYPE=echo MSG="SET BED {bed_temp}°C"
    M104 S{extruder_temp}
    M140 S{bed_temp}
    {% if wait != 'false' and wait != '0' %}
        {% if extruder_temp != 0 %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp-1} MAXIMUM={extruder_temp+1} TIMEOUT={printer['gcode_macro _global_var'].timeout_extruder}
        {% endif %}
        {% if bed_temp != 0 %}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp-1} MAXIMUM={bed_temp+1} TIMEOUT={printer['gcode_macro _global_var'].timeout_bed}
        {% endif %}
        RESPOND TYPE=echo MSG="TEMP OK {extruder_temp}/{bed_temp}°C"
    {% endif %}

