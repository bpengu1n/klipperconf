[gcode_macro CLEAN_NOZZLE]
description: Cleans the nozzle and avoids remaining poop on build plate. Cleaning poop will be kicked away with the nozzle after cooling.
gcode:
    {% if 'gcode_macro _global_var' not in printer %}
        {action_respond_info("Error: _global_var macro missing!")}
        M117 ERROR: GLOBAL VAR MISSING
        LCD_RED
        CANCEL_PRINT
    {% endif %}
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}
    {% set mesh_calibrate_temp = printer['gcode_macro _global_var'].bed_mesh_calibrate_target_temp|int %}
    LCD_WHITE #MOD LCD cleaning color
    M117 CLEAN NOZZLE
    {action_respond_info("Cleaning nozzle")}
    {% if current_target_temp != 0 %} #MOD bed heating when START PRINT
        M140 S{mesh_calibrate_temp}
    {% else %} # MOD bed heating when CLEANING ONLY
    M140 S{printer['gcode_macro _global_var'].clean_bed_temp}
    {% endif %}
    M104 S{extruder_temp}
    {% if printer.toolhead.homed_axes != "xyz" %}
       G28
    {% endif %}
    G90
    M117 PREPARE CLEAN
    G1 X344 Y308 Z2.6 F7000 #MOD Move to cleaning spot
    G1 X345 Y315 F7000 #MOD Poop move to POOP BEGIN POSITION
    M83 #MOD Relative E
    G90 E0 #MOD reset extruder distance
    G1 Z0.0 F600 #MOD Poop add noozle clean height
    M117 CLEANING PREHEAT
    LCD_ORANGE #MOD LCD preheat color
    M109 S{extruder_temp} #MOD Preheat - Wait extruder temp
    LCD_WHITE #MOD LCD cleaning color
    M117 CLEANING
    G1 Z1.0 #MOD Poop extrude height closer to bed higher poop sticking
    G1 X349 Y317 F7000 #MOD
    M400
    G91 #MOD Relative Positioning
    G1 E16 F250 #MOD Poop add EXTRUDE POOP 1
    G90 #MOD Absolute Positioning
    G1 X345 Y315 F7000 #MOD Poop move to POOP END POSITION
    G91 #MOD Relative Positioning
    G1 E32 F250 #MOD Poop add EXTRUDE POOP 2
    G90 #MOD Absolute Positioning
    G1 Z1.3 #MOD lift nozzle a bit
    M106 S255
    G91 #MOD Relative Positioning
    G1 E10 F250 #MOD Poop add EXTRUDE POOP 3
    G90 #MOD Absolute Positioning
    M140 S0 #MOD STOP HEATING now to avoid poop on plate
    M109 S0 #MOD STOP HEATING now to avoid oozing
    G4 P400 #MOD Poop add noozle clean wait cool
    G1 Z2.4 F100 #MOD raise to not stick
    G4 P2000 #MOD Poop add noozle clean wait cool
    G1 X347 Y315 Z4.5 F20 #MOD raise nozzle cleaned
    M117 CLEANING COOLING
    G4 P800 #MOD wait
    G1 Z4.9 F300 #MOD wipe nozzle height
    G4 P6000 #MOD wait
    M117 CLEANING STAGE1
    G1 X354 Y290 F10000 #MOD Strings wipe
    M400 #MOD wait move finished
    G1 Z7.0 F300
    G1 Y260 F10000 #MOD Strings wipe
    G1 X310 Y359 F10000 #MOD
    G1 X352 F9000 #MOD brush start position
    G1 Z1.0 F300 #MOD rip height if non-stick
    G1 Y360 X310 F10000 #MOD Poop rip non stick poop away WIGGLE LEFT 1
    G1 Y356 X354 F10000 #MOD Poop rip non stick poop away WIGGLE RIGHT 1
    G1 Y360 X310 F10000 #MOD Poop rip non stick poop away WIGGLE LEFT 1
    M400 #MOD wait move finished
    G1 Z0.9 F300
    G1 Y360 X318 F4500 #MOD add full silicone brush
    G1 Y356 X320 #MOD add full silicone brush
    G1 Y360 X322
    G1 Y356 X324
    G1 Y360 X326
    G1 Y356 X328
    G1 Y360 X330
    G1 Y356 X332
    G1 Y360 X334
    G1 Y356 X336
    G1 Y360 X338
