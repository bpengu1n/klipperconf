    G4 P1500 #MOD wait
    G1 Z0.6 F300 #MOD brush height
    G1 Y356 X354 F6000 #MOD Brush WIGGLE RIGHT 1
    M400 #MOD wait move finished
    G1 Z9 F600 #MOD Poop blow away
    G4 P200 #MOD Poop add wait
    M400
    G1 Z0.7 F600 #MOD Brush height
    G1 Y360 X354 F10000 #MOD Brush WIGGLE RIGHT 1
    G1 Y356 X308 F10000 #MOD Brush WIGGLE LEFT 1
    M400 #MOD
    M117 CLEANING BLOW
