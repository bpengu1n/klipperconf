    G1 Y360 X342 #MOD add full silicone brush
    G1 Y356 X344 #MOD add full silicone brush
    G1 Y360 X346 #MOD add full silicone brush
    G1 Y356 X348 #MOD add full silicone brush
    G1 Y360 X350 #MOD add full silicone brush
    G1 Y356 X352 #MOD add full silicone brush
    G1 Z7 F300 #MOD wipe nozzle height
    M400 #MOD wait move finished
    G1 X344 Y314 F7000 #MOD PARK nozzle for cooling
    M400 #MOD wait move finished
    M117 CLEANING COOLING
    G4 P2000 #MOD Poop add noozle clean wait cool
    G1 X342 Y314 Z4.8 F300 #MOD wipe nozzle height
    G4 P2000 #MOD Poop add noozle clean wait cool
    G1 Z3.8 F300 #MOD wipe nozzle height
    G4 P24000 #MOD Poop add noozle clean wait cool
    G1 Z7 F300 #MOD wipe nozzle height
    M400 #MOD wait move finished
    M117 CLEANING KICK
    G1 X350 Y260 F10000 #MOD Strings wipe
    M400 #MOD wait move finished
    G1 X345 Y315 F7000 #MOD Poop move to POOP END POSITION
    G1 Z2.5 F300 #MOD Poop KICK AWAY height 1/2
    M400 #MOD
    G1 X344 Y314 F7000 #MOD loosen a bit
    G1 X346 Y316 F7000 #MOD loosen a bit
    G1 X345 Y315 F7000 #MOD loosen a bit
    G1 X351 Y340 F5000 #MOD Position KICK poop away 1try
    G1 Z2.3 F300 #MOD Poop KICK AWAY height 2/2
    M400 #MOD wait move finished
    G1 X355 Y359 F2000 #MOD Brush start position
    M400 #MOD
    G1 Z0.8 F300 #MOD brush height
